android {
    compileSdk 34 // Atau versi terbaru yang stabil

    defaultConfig {
        applicationId "com.ofaid.anonmumble"
        // ✅ Target Android 7.0 (API 24) ke atas
        minSdk 24 
        targetSdk 34
        
        versionCode 1
        versionName "1.0"
        
        // ✅ Opsional: Jika pakai NDK/C++, batasi arsitektur agar APK lebih kecil
        // ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    buildTypes {
        release {
            minifyEnabled true      // ✅ Aktifkan ProGuard/R8 untuk mengecilkan ukuran & obfuscate kode
            shrinkResources true    // ✅ Hapus resource yang tidak terpakai
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Pastikan signing config sudah diatur jika ingin langsung install (opsional di CI)
            // signingConfig signingConfigs.release 
        }
    }
}