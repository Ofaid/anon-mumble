buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

def signingFile = file('signing.gradle')
if (signingFile.exists()) apply from: signingFile

allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation"
    }
}

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true 
    }

    base {
        archivesName = "anon-mumble"
    }

    buildFeatures {
        buildConfig = true
    }

    // ✅ AMANKAN NATIVE LIBRARY (.so) AGAR TIDAK DIBUANG
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/*.so'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdk = 34
        applicationId "gratis.anon.mumble"
        versionCode 7
        versionName "1.0.6-OFAID"
        
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "VERSIONTAG", "\"1.0.6-OFAID\""
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    flavorDimensions "release"
    productFlavors {
        foss {
            dimension "release"
            applicationId "gratis.anon.mumble"
        }
    }

    buildTypes {
        release {
            minifyEnabled false      
            shrinkResources false   // ✅ MATIKAN! Ini penyebab utama FC saat join server
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (project.hasProperty("signingConfigs") && signingConfigs.hasProperty("release")) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            versionNameSuffix "-debug"
        }
    }

    lint {
        abortOnError = false
        disable 'InvalidPackage', 'MissingTranslation'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation project(":libraries:humla")
    
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'
    implementation 'info.guardianproject:tor-android:0.4.8.16'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}