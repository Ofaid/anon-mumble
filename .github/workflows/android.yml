name: Bangun Anon-Mumble OFAID

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Bangun APK Rilis (Android 7+)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Ambil kode sumber beserta submodul (penting untuk library humla)
      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Setup Java 21 Temurin (Wajib untuk AGP 8.7.3)
      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # 3. FIX ERROR: Upgrade ke v4 agar tidak gagal mencari package 'tools' yang deprecated
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      # 4. Berikan izin eksekusi pada wrapper Gradle
      - name: Izin jalankan Gradle
        run: chmod +x gradlew

      # 5. Build khusus flavor 'foss' release (sesuai build.gradle baru)
      # --no-daemon: Mencegah memory leak di runner CI
      # --stacktrace: Memudahkan debugging jika ada error
      - name: Bangun Versi Rilis Foss
        run: ./gradlew assembleFossRelease --no-daemon --stacktrace

      # 6. Verifikasi bahwa APK benar-benar terbentuk sebelum upload
      - name: Verifikasi Output APK
        run: |
          echo "📦 Mengecek file APK yang dihasilkan..."
          ls -lh app/build/outputs/apk/foss/release/*.apk || echo "❌ GAGAL: Tidak ada APK ditemukan!"

      # 7. Upload artifact dengan path yang BENAR (foss/release)
      - name: Simpan APK hasil
        uses: actions/upload-artifact@v4
        with:
          name: AnonMumble-Rilis-Clean
          path: app/build/outputs/apk/foss/release/*.apk
          retention-days: 30
          if-no-files-found: error