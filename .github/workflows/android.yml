name: Bangun Anon-Mumble OFAID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Bangun APK Rilis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build SpongyCastle Library
        run: |
          cd libraries/humla/libs/humla-spongycastle
          
          if [ ! -f "gradlew" ]; then
            wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
            unzip -q gradle-4.10.3-bin.zip
            GRADLE_CMD="./gradle-4.10.3/bin/gradle"
          else
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          fi
          
          sed -i 's/archiveClassifier = .*/classifier = "javadoc"/g' build.gradle
          sed -i 's/archiveClassifier = .*/classifier = "sources"/g' build.gradle
          
          $GRADLE_CMD build -x test -x javadoc -PsourceCompatibility=1.8 -PtargetCompatibility=1.8 --no-daemon

      - name: Build Main App
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnonMumble-Rilis-Clean
          path: app/build/outputs/apk/foss/release/*.apk
          retention-days: 30
          if-no-files-found: error