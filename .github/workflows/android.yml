# ✅ STEP FIX: Patch Script + Build Tanpa Javadoc
      - name: Build SpongyCastle (No-Javadoc)
        run: |
          echo " Masuk ke folder SpongyCastle..."
          cd libraries/humla/libs/humla-spongycastle
          
          # 1. FIX ERROR archiveClassifier (Ganti ke syntax lama 'classifier')
          echo "️ Mempatch build.gradle agar kompatibel..."
          sed -i 's/archiveClassifier = .*/classifier = "javadoc"/g' build.gradle
          sed -i 's/archiveClassifier = .*/classifier = "sources"/g' build.gradle
          
          # 2. Download Gradle Wrapper jika tidak ada
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew tidak ditemukan! Mengunduh Gradle 4.10.3..."
            wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
            unzip -q gradle-4.10.3-bin.zip
            GRADLE_CMD="./gradle-4.10.3/bin/gradle"
          else
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          fi
          
          # 3. Build DENGAN MEMATIKAN JAVADOC (-x javadoc)
          # Ini solusi utama untuk error "tag not supported in HTML5"
          echo "🔨 Memulai build SpongyCastle (Javadoc dimatikan)..."
          $GRADLE_CMD build -x test -x javadoc \
            -PsourceCompatibility=1.8 \
            -PtargetCompatibility=1.8 \
            --no-daemon
            
          echo "✅ Build selesai. Verifikasi file jar..."
          find . -name "*.jar" -path "*/build/libs/*" -ls || echo "❌ GAGAL: File jar tidak ditemukan!"