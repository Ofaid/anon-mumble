name: Bangun Anon-Mumble OFAID

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Bangun APK Rilis (Android 7+)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Siapkan Java 21
        uses: actions/setup-java@v5 # Upgrade ke v5 sesuai warning
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      # ✅ STEP BARU: Build Library SpongyCastle Lokal Dulu!
      # Ini wajib agar file .jar terbentuk di folder build/libs/
      - name: Build SpongyCastle Local
        run: |
          cd libraries/humla/libs/humla-spongycastle
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
        continue-on-error: false 

      - name: Izin jalankan Gradle Utama
        run: chmod +x gradlew

      - name: Bangun Versi Rilis Foss
        run: ./gradlew assembleFossRelease --no-daemon --stacktrace

      - name: Verifikasi Output APK
        run: |
          echo "📦 Mengecek file APK..."
          ls -lh app/build/outputs/apk/foss/release/*.apk || echo "❌ GAGAL: APK tidak ditemukan!"

      - name: Simpan APK hasil
        uses: actions/upload-artifact@v4
        with:
          name: AnonMumble-Rilis-Clean
          path: app/build/outputs/apk/foss/release/*.apk
          retention-days: 30
          if-no-files-found: error